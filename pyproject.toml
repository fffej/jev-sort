[project]
name = "jev-sort"
version = "0.1.0"
description = "Sort with Jev answering only: Which comes first?"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.5.7", "python-dotenv>=1.0"]

[project.scripts]
jev-sort = "jev_sort:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["jev_sort"]
